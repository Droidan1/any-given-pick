name: Send player email reminders

on:
  schedule:
    # Hourly processing keeps the 24-hour deadline reminder timely while
    # leaving provider retries and duplicate protection to the application.
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: production-email-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request production email cycle
        env:
          APP_CRON_SECRET: ${{ secrets.SCORE_SYNC_CRON_SECRET }}
        run: |
          test -n "$APP_CRON_SECRET"
          curl --fail-with-body --retry 2 --retry-all-errors --max-time 50 \
            --header "Authorization: Bearer $APP_CRON_SECRET" \
            https://anygivenpick.app/api/cron/emails
