name: Sync game scores

on:
  schedule:
    # Ten-minute checks during typical Thursday–Monday game windows (UTC),
    # plus three daily upcoming-line checks. This keeps odds reasonably fresh
    # without exceeding the private-repository Actions budget.
    - cron: "2-52/10 22-23 * * 1,4,5,6"
    - cron: "2-52/10 0-5 * * 0,1,2,5,6"
    - cron: "2-52/10 17-21 * * 0"
    - cron: "15 12,17,22 * * *"
  workflow_dispatch:

concurrency:
  group: production-score-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request production score sync
        env:
          SCORE_SYNC_CRON_SECRET: ${{ secrets.SCORE_SYNC_CRON_SECRET }}
        run: |
          test -n "$SCORE_SYNC_CRON_SECRET"
          curl --fail-with-body --retry 2 --retry-all-errors --max-time 45 \
            --header "Authorization: Bearer $SCORE_SYNC_CRON_SECRET" \
            https://anygivenpick.app/api/cron/scores
